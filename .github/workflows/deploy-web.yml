name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  # Inlined into the bundle at build time by Bun (--env='BUN_PUBLIC_*').
  BUN_PUBLIC_API_BASE: https://the-plan-api-480187173082.us-central1.run.app/api/v1

jobs:
  deploy:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    # contents:write lets the final step tag the commit and open a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generated release notes can diff against the
          # previous web release tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web
        run: bun run build

      - name: Show stamped version
        run: cat web/dist/version.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      - name: Verify the deployed version is live
        run: |
          BUILT=$(jq -r .commit web/dist/version.json)
          echo "Built commit: $BUILT"

          # Right after a deploy the edge can briefly serve the SPA fallback for
          # a path that is new, so parse defensively and keep retrying rather
          # than letting a parse error abort the loop.
          for attempt in $(seq 1 12); do
            LIVE=$(curl -fsS https://the-plan.raregazzetto.me/version.json 2>/dev/null \
              | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$LIVE" = "$BUILT" ]; then
              echo "::notice::Deployed commit $LIVE is live."
              exit 0
            fi
            echo "attempt ${attempt}: serving '${LIVE:-<no json yet>}', expected ${BUILT}; retrying in 5s"
            sleep 5
          done

          echo "::error::/version.json did not report the built commit within the timeout."
          exit 1

      # Only after a verified deploy, so a tag always means "this shipped".
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version web/package.json)
          TAG="web-v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — skipping. Bump 'version' in web/package.json to cut a new release."
            exit 0
          fi

          # Plain pushes never produce PRs, so GitHub's --generate-notes would
          # emit an empty changelog. Build the notes from the commits that
          # actually touched the web app instead.
          PREV=$(git describe --tags --abbrev=0 --match 'web-v*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..HEAD"
            HEADING="Changes since \`${PREV}\`"
          else
            RANGE="HEAD"
            HEADING="Initial release"
          fi

          {
            echo "Deployed to https://the-plan.raregazzetto.me"
            echo
            echo "**Version:** \`${VERSION}\` · **Commit:** \`${GITHUB_SHA:0:12}\`"
            echo
            echo "### ${HEADING}"
            echo
            git log --no-merges --pretty=format:'- %s (`%h`)' "$RANGE" -- web/ | head -80
            echo
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Web v${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/release-notes.md

          echo "::notice::Created release $TAG"
