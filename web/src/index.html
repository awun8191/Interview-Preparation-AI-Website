<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Executive communication practice. Eleven methodologies, scored against a typed rubric in under a second." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>The Plan — Executive Communication Practice</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theplan.theme");
          if (stored !== "light" && stored !== "dark") {
            stored = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = stored;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
